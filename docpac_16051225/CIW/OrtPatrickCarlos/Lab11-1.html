<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 11-1</title>
    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>

		<!-- Feature check: Verify if the browser supports the Fetch API -->
		<script>
		  // Check if fetch is available in the browser
		  if ('fetch' in window) {
			console.log('Fetch API is supported.');
		  } else {
			console.log('Fetch API is not supported.');
		  }

		  // Check if the browser supports plugins and list them if available
		  if (navigator.plugins && navigator.plugins.length > 0) {
			console.log('Pluins supported. Installed plugins:');
			for (let i = 0; i < navigator.plugins.length; i++) {
			console.log(navigator.plugins[i].name);
			}
		} else {
			console.log('No plugins supported or no plugins installed.');
		}

		</script>

	</body>
</html>
