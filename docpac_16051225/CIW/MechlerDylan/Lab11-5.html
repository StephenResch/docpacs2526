<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 11-5</title>
	<style>
		button {
			margin: 5px;
			padding: 10px;
		}

		#output {
			margin-top: 20px;
			border-top: 1px solid #ccc;
			padding-top: 10px;
		}
	</style>

</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>
	<h3>Web Developer Ethics & Privacy Lab</h3>

	<p>Click a topic below to learn more and reflect:</p>

	<button id="ethicsBtn">Ethical Behavior for Web Professionals</button>
	<button id="privacyBtn">Privacy and Trust</button>
	<button id="fairUseBtn">Fair Use of User Data</button>
	<button id="lawsBtn">Laws Against Privacy Violations</button>
	<button id="intellectualBtn">Intellectual Property Rights</button>



	<div id="output"></div>

	<script>
		const output = document.getElementById('output');

		const topics = {
			ethics: "Do not misuse personal data, do not spread misinformation, ensure user data is secure, and respect users.",
			privacy: "Privacy gives users the right to control how their data is collected and used. Trust is how much users believe that you will protect their data and privacy, the users' level of trust affects your company or brand's reputation.",
			fairUse: "Fair use of user data is using a user's data for only what they have agreed to and are aware of.",
			laws: "Insert your definition here.",
			intellectual: "Insert your definition here."
		};

		document.getElementById('ethicsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.ethics}</p>`;
		});

		document.getElementById('privacyBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.privacy}</p>`;
		});

		document.getElementById('fairUseBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.fairUse}</p>`;
		});

		document.getElementById('lawsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.laws}</p>`;
		});

		document.getElementById('intellectualBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.intellectual}</p>`;
		});

	</script>

</body>

</html>
