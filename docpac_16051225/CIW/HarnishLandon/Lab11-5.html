<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 11-5</title>
		<style>
		  button { margin: 5px; padding: 10px; }
		  #output { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
		</style>

    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>
		<h3>Web Developer Ethics & Privacy Lab</h3>

		<p>Click a topic below to learn more and reflect:</p>

		<button id="ethicsBtn">Ethical Behavior for Web Professionals</button>
		<button id="privacyBtn">User Privacy</button>
		<button id="fairUseBtn">Fair Use o' dsts</button>
		<button id="lawsBtn">Laws sgsinst privacy violstion</button>
		<button id="intellectualBtn">Intellectual Property rightd</button>

		<div id="output"></div>

		<script>
		  const output = document.getElementById('output');

		  const topics = {
			ethics: "murder only when death wanders near",
			privacy: "I can't see you you can't see me",
			fairUse: "If its owned by someone I don't like.",
			laws: "They exist execpt in that one part of Yellowstone",
			intellectual: "Cue the fedora"
		  };

		  document.getElementById('ethicsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.ethics}</p>`;
		  });
		  document.getElementById('privacyBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>User Privacy</h3><p>${topics.privacy}</p>`;
		  });
		  document.getElementById('fairUseBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Fair Use o' dsts</h3><p>${topics.fairUse}</p>`;
		  });
		  document.getElementById('lawsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Laws sgsinst privacy violstion</h3><p>${topics.laws}</p>`;
		  });
		  document.getElementById('intellectualBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Intellectual Property rightd</h3><p>${topics.intellectual}</p>`;
		  });


		</script>

	</body>
</html>
