<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 11-5</title>
		<style>
		  button { margin: 5px; padding: 10px; }
		  #output { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
		</style>

    </head>
	
	<body>
	  <h2>CIW JavaScript Specialist</h2>
	  <hr>
		<h3>Web Developer Ethics & Privacy Lab</h3>

		<p>Click a topic below to learn more and reflect:</p>

		<button id="ethicsBtn">Ethical Behavior for Web Professionals</button>
		<button id="privacyBtn">Privacy Issues</button>
		<button id="fairUseBtn">Fair Use</button>
		<button id="lawsBtn">Laws and Regulations</button>
		<button id="intellectualBtn">Intellectual Property</button>


		<div id="output"></div>

		<script>
		  const output = document.getElementById('output');

		  const topics = {
			ethics: "Moral principles that govern a person's behavior or the conducting of an activity.",
			privacy: "The state or condition of being free from being observed or disturbed by other people.",
			fairUse: "(In US copyright law) the doctrine that brief excerpts of copyright material may, under certain circumstances, be quoted verbatim for purposes such as criticism, news reporting, teaching, and research, without the need for permission from or payment to the copyright holder.",
			laws: "The system of rules which a particular country or community recognizes as regulating the actions of its members and which it may enforce by the imposition of penalties.",
			intellectual: "A person possessing a highly developed intellect."
		  };

		  document.getElementById('ethicsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.ethics}</p>`;
		  });

		document.getElementById('privacyBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Privacy Issues</h3><p>${topics.privacy}</p>`;
		});

		document.getElementById('fairUseBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Fair Use</h3><p>${topics.fairUse}</p>`;
		});

		document.getElementById('lawsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Laws and Regulations</h3><p>${topics.laws}</p>`;
		});

		document.getElementById('intellectualBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Intellectual Property</h3><p>${topics.intellectual}</p>`;
		});

		</script>

	</body>
</html>
