<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lesson 13 Application Project</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 40px;
			}
			button {
				margin-right: 10px;
				padding: 10px 20px;
				font-size: 16px;
				cursor: pointer;
			}
			#result {
				margin-top: 20px;
				font-size: 18px;
				white-space: pre-wrap;
			}
		</style>
    </head>
	
	<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>
		<h4>AJAX</h4>

		<button id="button1">Load Data with Server</button>
		<button id="button2">Load Data without Server</button>

		<div id="result"></div>

		<script>
		const resultDiv = document.getElementById('result');

		//Create function loadDataWithServer
		function loadDataWithServer() {
			fetch('https://www.ucertify.com/utils/sampledata.php')
				.then(response => {
					if (!response.ok) {
						throw new Error('Network response was not ok ' + response.statusText);
					}
					return response.json();
				})
				.then(data => {
					resultDiv.textContent = 'Data from server:\n' + JSON.stringify(data, null, 2);
				})
				.catch(error => {
					resultDiv.textContent = 'Fetch error: ' + error.message;
				});
		}

		//Create function loadDataWithoutServer
		function loadDataWithoutServer() {
			const data = {
				name: "John Doe",
				course: "CIW JavaScript Specialist",
				status: "Enrolled"
			};
			resultDiv.textContent = 'Data without server:\n' + JSON.stringify(data, null, 2);
		}




		//Add event listeners
		document.getElementById("button1").addEventListener("click", loadDataWithServer);
		document.getElementById("button2").addEventListener("click", loadDataWithoutServer);
		</script>

	</body>
</html>
