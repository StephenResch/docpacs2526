<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 10-1</title>
</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>

	<form name="myForm" id="myForm">
		<label><b>Name</b></label>
		<input type="text" placeholder="FirstName" name="fname" required>
		<input type="text" placeholder="LastName" name="lname" required> <br>
		<label><b>EMail</b></label>
		<input type="text" placeholder="Enter Email ID" name="email" required> <br>
		<label><b>Password</b></label>
		<input type="password" placeholder="Enter Password" name="pwd" required maxlength="10"> <br>
		<label><b>Gender</b></label>
		<input type="radio" name="gen" value="male">Male
		<input type="radio" name="gen" value="female">Female <br>
		<input type="submit" value="Submit">
		<input type="reset" value="Reset">
	</form>
	<script>
		const form = document.getElementById('myForm')
		document.addEventListener("click", function (e) {
			if (e.target && e.target.nodeName == "INPUT" && e.target.type == "submit") {
				e.preventDefault();
				const fname = form.fname.value;
				const email = form.email.value;
				if (fname.length == 0) {
					alert("Name is required to access the assignments page.");
					return;
				}
				else if (!email.includes("@")) {
					alert("Please enter a valid email address.");
					return;
				}
				else {
					window.location.href = "https://www.ciwcertified.com";
				}
			}
		});
	</script>
</body>

</html>
