<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 10-3</title>
    </head>
	
	<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>

	<form name="myForm" id="myForm">
		<label for="mySelect">Select an Item</label><br>
		<select name="mySelect" id="mySelect" onchange="isSelected(this.form);">
			<option value="" disabled selected>First option</option>
			<option value="1">Second option</option>
			<option value="2">Third option</option>
		</select><br>
		<button type="button" onclick="isSelected(this.form);">Check Selection</button>
		<button type="reset">Reset</button>
	</form>

	<script>
		function isSelected(form) {
		const len = form.mySelect.length;
		// Create for loop
		const loopEnd = len - 1;
		for (let i = 0; i <= loopEnd; i++) {
			if (form.mySelect.options[i].selected && form.mySelect.options[i].value !== "") {
				alert("You selected: " + form.mySelect.options[i].value);
				return true;
			} if (i === loopEnd) {
		alert("Please select an item from the list.");
		return false;
		
		} else {
			continue;	
		}
		};
		}
		</script>
	</body>
</html>
