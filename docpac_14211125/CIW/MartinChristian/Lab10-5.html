<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 10-5</title>
	<style>
		body {
			font-family: Arial, sans-serif;
		}

		#lblValues {
			margin-top: 20px;
			white-space: pre-line;
			/* preserves line breaks */
		}
	</style>
</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>


	<form id="myForm" name="myForm">
		<p>
			Your Name:<br><br>
			<input type="text" name="Your_Name" id="Your_Name" placeholder="Enter your name">
		</p>
		<p>
			Interesting Fact About You:<br><br>
			<textarea name="Interesting_Fact" id="Interesting_Fact" placeholder="Enter some text"></textarea>
		</p>
		<input type="submit" value="Submit Data"><input type="reset" value="Reset Form">
	</form>

	<hr>
	<div id="lblValues"></div>

	<script>
		document.getElementById('myForm').addEventListener('submit', function (event) {
			event.preventDefault();

			const elements = this.elements;
			let output = '';
			let isValid = true;

			for (let i = 0; i < elements.length; i++) {
				const field = elements[i];
				const type = field.type;
				const name = field.name || '';
				const value = field.value;

				if ((type === 'text' || type === 'textarea') && value.trim() === '') {
					alert(`Please fill out the ${name.replace('_', ' ') || "unnamed"} field.`);
					field.focus();
					isValid = false;
					break;
				}


				output += 'Type: ' + type + '  ';
				output += 'Name: ' + name + '  ';
				output += 'Value: ' + value + '\n';
			}

			if (isValid) {
				document.getElementById('lblValues').textContent = output;
			}
		});
	</script>

</body>

</html>
