<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 10-1</title>
    </head>
	
	<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>

		<form name="myForm" id="myForm">
		<label><b>Name</b></label>
		<input type="text" placeholder="FirstName" name="fname" required> 
		<input type="text" placeholder="LastName" name="lname" required> <br>
		<label><b>Email</b></label>
		<input type="email" placeholder="Enter Email ID" name="email" required> <br>
		<label><b>Password</b></label>
		<input type="password" placeholder="Enter Password" name="pwd" maxlength="10" required> <br>
		<label><b>Gender</b></label>
		<input type="radio" name="gen" value="male">Male
		<input type="radio" name="gen" value="female">Female <br>
		<input type="submit" value="Submit">
		<input type="reset" value="Reset">
		</form>
		<script>
			document.getElementById('myForm').addEventListener('submit', function(event) {
				var name = this.fname.value.trim();
				if (name === '') {
					alert('Name is required to access the assignments page');
					event.preventDefault();
				} else {
					event.preventDefault();
					window.location.href = 'https://ciwcertified.com/';
				}
			})
		</script>
	</body>
</html>
